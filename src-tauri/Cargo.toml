[package]
name = "mdviewer"
version = "0.4.0-1"
description = "A powerful, lightweight Markdown editor"
authors = ["MDViewer Contributors"]
license = "MIT"
repository = "https://github.com/jojo-swe/MDViewer"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
exacl = "0.12.0"
libc = "0.2"
xattr = "1.6.1"
